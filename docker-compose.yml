services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
      - ./credentials:/app/credentials
    env_file: .env
    networks:
      - mamaguard

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    expose:
      - "5001"
    volumes:
      - ./admin:/app
    env_file: .env
    networks:
      - mamaguard

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
      - admin
    networks:
      - mamaguard

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - mamaguard

networks:
  mamaguard:
    driver: bridge
