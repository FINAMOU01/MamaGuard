{% extends "admin/layout.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height:80vh;">
  <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">
    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle shadow" style="width:80px;height:80px;background:linear-gradient(135deg,#E91E63,#F06292);">
            <i class="bi bi-heart-pulse-fill text-white fs-2"></i>
          </div>
          <h4 class="fw-bold mb-1">MamaGuard Admin</h4>
          <p class="text-muted small mb-0">Connectez-vous pour accéder au panneau d'administration</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-envelope me-1"></i>Email</label>
            <input type="email" name="email" class="form-control form-control-lg" placeholder="admin@mamaguard.com" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label"><i class="bi bi-lock me-1"></i>Mot de passe</label>
            <input type="password" name="password" class="form-control form-control-lg" placeholder="Entrez votre mot de passe" required>
          </div>
          <button type="submit" class="btn btn-lg w-100 text-white fw-semibold border-0 rounded-pill" style="background:linear-gradient(135deg,#E91E63,#F06292);box-shadow:0 4px 14px rgba(233,30,99,0.35);">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
          </button>
        </form>
        <div class="text-center mt-4">
          <small class="text-muted">Plateforme de gestion des médecins et patientes</small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
