{% extends "admin/layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle" style="width:64px;height:64px;background:linear-gradient(135deg,#E91E63,#F06292);">
            <span class="text-white fw-bold fs-4">A</span>
          </div>
          <h5 class="fw-bold">Accès administrateur</h5>
          <p class="text-muted small">Connectez-vous avec votre email et mot de passe</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control form-control-lg rounded-3" placeholder="admin@mamaguard.com" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control form-control-lg rounded-3" placeholder="Entrez votre mot de passe" required>
          </div>
          <button type="submit" class="btn btn-lg w-100 text-white fw-bold border-0 rounded-3" style="background:linear-gradient(135deg,#E91E63,#F06292);">Se connecter</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
